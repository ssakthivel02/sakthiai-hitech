name: SakthiAI Focus Touch Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focus-touch-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate focus and touch accessibility contract
        run: node scripts/validate-focus-touch-accessibility.mjs
