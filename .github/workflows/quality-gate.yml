name: SakthiAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production source neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          files=(vite.config.ts render.yaml server/_core/index.ts server/_core/llm.ts server/_core/sdk.ts server/_core/oauth.ts server/storage.ts server/_core/storageProxy.ts client/src/const.ts client/src/_core/hooks/useAuth.ts)
          if grep -En -i "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|manus-asia\.computer|manuscomputer\.ai|manusvm\.computer|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|types/manusTypes" "${files[@]}"; then
            echo "Forbidden Manus/Forge/WebDev coupling detected in production-critical SakthiAI source."
            exit 1
          fi

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deployable artifact neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn -i "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|manus-asia\.computer|manuscomputer\.ai|manusvm\.computer|BUILT_IN_FORGE|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|/manus-storage/|/__manus__/" dist; then
            echo "Forbidden Manus/Forge/WebDev marker found in deployable SakthiAI dist output."
            exit 1
          fi
