name: SakthiAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Core runtime neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          files=(
            vite.config.ts
            server/_core/llm.ts
            server/storage.ts
            server/_core/storageProxy.ts
            server/_core/sdk.ts
            server/_core/oauth.ts
            client/src/const.ts
            client/src/_core/hooks/useAuth.ts
          )
          if grep -En "forge\.manus\.im|vite-plugin-manus-runtime|/__manus__/|manus-storage|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|types/manusTypes" "${files[@]}"; then
            echo "Forbidden Manus/Forge/WebDev runtime coupling detected in production-critical core files."
            exit 1
          fi

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
