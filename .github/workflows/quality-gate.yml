name: SakthiAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository-wide runtime neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -En -i "forge\.manus\.im|vite-plugin-manus-runtime|/__manus__/|manus-storage|manuspre\.computer|manus\.computer|manus-asia\.computer|manuscomputer\.ai|manusvm\.computer|BUILT_IN_FORGE|WebDevAuthPublicService|/app-auth|OAUTH_SERVER_URL|types/manusTypes" -- \
            ':!*.md' ':!*.json' ':!pnpm-lock.yaml' ':!*.example' ':!.github/workflows/quality-gate.yml'; then
            echo "Forbidden Manus/Forge/WebDev runtime coupling detected in SakthiAI executable/config source."
            exit 1
          fi

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
