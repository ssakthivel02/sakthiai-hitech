name: SakthiAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret hygiene (tracked content)
        run: node scripts/validate-secret-hygiene.mjs

      - name: Production dependency advisories (no critical/high)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/audit
          pnpm audit --prod --json > reports/audit/audit-prod.json || true
          node -e "const r=require('./reports/audit/audit-prod.json');const v=r.metadata&&r.metadata.vulnerabilities;if(!v){console.error('audit report unreadable');process.exit(1)}console.log('production advisories',JSON.stringify(v));if(v.critical||v.high){console.error('critical/high production advisories present');process.exit(1)}"

      - name: Governed intelligence integrity
        run: pnpm intelligence:check

      - name: Deterministic capability and intelligence evals (contract harness, no network)
        run: pnpm evals

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/evals/eval-report.json
            reports/evals/golden-benchmark.json
            reports/evals/golden-benchmark.md
          if-no-files-found: warn

      - name: Video pre-generation quality contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-video-generation-request.mjs research/generative-media/fixtures/video-generation-request-pass.json
          if node scripts/validate-video-generation-request.mjs research/generative-media/fixtures/video-generation-request-fail.json; then
            echo "Deliberately invalid video generation request unexpectedly passed."
            exit 1
          fi
          echo "Invalid pre-generation request correctly rejected."

      - name: Evidence-based video candidate routing
        run: node scripts/test-video-generation-routing.mjs

      - name: Selective video shot regeneration
        run: node scripts/test-video-shot-regeneration.mjs

      - name: Video assembly integrity
        run: node scripts/test-video-assembly-integrity.mjs

      - name: Cross-shot video seam quality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-video-seam-quality.mjs research/evaluation/fixtures/video-seam-quality-pass.json
          if node scripts/validate-video-seam-quality.mjs research/evaluation/fixtures/video-seam-quality-fail.json; then
            echo "Deliberately discontinuous video seam fixture unexpectedly passed."
            exit 1
          fi
          echo "Discontinuous video seam correctly rejected."

      - name: Video quality scoring fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/score-video-quality-review.mjs research/evaluation/fixtures/video-quality-publish-pass.json
          node scripts/score-video-quality-review.mjs research/evaluation/fixtures/video-quality-assisted-human-preview.json
          node scripts/score-video-quality-review.mjs research/evaluation/fixtures/video-quality-regenerate.json
          node scripts/score-video-quality-review.mjs research/evaluation/fixtures/video-quality-reject.json
          if node scripts/score-video-quality-review.mjs research/evaluation/fixtures/video-quality-output-mismatch.json; then
            echo "Deliberately nonconforming video output unexpectedly passed."
            exit 1
          fi
          echo "Output/request mismatch correctly rejected."

      - name: Video release readiness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-video-release-readiness.mjs research/evaluation/fixtures/video-release-readiness-pass.json
          if node scripts/validate-video-release-readiness.mjs research/evaluation/fixtures/video-release-readiness-fail.json; then
            echo "Deliberately uncleared release-readiness fixture unexpectedly passed."
            exit 1
          fi
          echo "Uncleared release-readiness fixture correctly rejected."

      - name: Production source neutrality guard
        run: node scripts/validate-source-neutrality.mjs

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test --reporter=default --reporter=json --outputFile=reports/unit/vitest-report.json

      - name: Build
        run: pnpm build

      - name: Deployable artifact neutrality guard
        run: node scripts/validate-source-neutrality.mjs --dist

      - name: Built-server behavior smoke (healthz, SPA shell, fail-closed readyz, served artifact identity)
        run: node scripts/smoke-built-server.mjs

      - name: Verify built-artifact manifest
        run: node scripts/release-manifest.mjs --verify

      - name: Upload validate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-evidence
          path: |
            reports/unit/vitest-report.json
            reports/audit/audit-prod.json
            reports/release/smoke.json
            reports/evals/eval-report.json
            reports/evals/golden-benchmark.json
          if-no-files-found: warn

  mysql-integration:
    # Real MySQL 8 qualification: migrations vs schema, session revocation, tenancy, upload/scanner protocol,
    # storage ownership, retrieval, provider policy/budget/breaker persistence, readiness. Disposable service
    # container only; never a hosted database.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real-MySQL integration tests
        env:
          TEST_DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
        run: pnpm test:mysql

      - name: Migration manifest (baseline 0000-0004 -> latest, rerun no-op, data preservation, fresh-schema parity, backfill)
        env:
          TEST_DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
        run: pnpm staging:migration-manifest

      - name: Upload migration manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest
          path: reports/staging/runtime-migration-manifest.json
          if-no-files-found: warn

      - name: Upload MySQL integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-report
          path: reports/mysql/vitest-report.json
          if-no-files-found: warn

      - name: Upload recovery rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-report
          path: reports/recovery/recovery-report.json
          if-no-files-found: warn

  mysql-84-compatibility:
    # Same real-MySQL suite and migration manifest on MySQL 8.4 LTS, the major version of the managed preview
    # database (8.4.8). 8.0 evidence does not transfer: 8.4 disables mysql_native_password by default and changes
    # several defaults. Separate job so the existing mysql-integration check name is unchanged. Disposable
    # service container only; never a hosted database.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real-MySQL integration tests
        env:
          TEST_DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
        run: pnpm test:mysql

      - name: Migration manifest (baseline 0000-0004 -> latest, rerun no-op, data preservation, fresh-schema parity, backfill)
        env:
          TEST_DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
        run: pnpm staging:migration-manifest

      - name: Upload migration manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest-mysql84
          path: reports/staging/runtime-migration-manifest.json
          if-no-files-found: warn

      - name: Upload MySQL integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-report-mysql84
          path: reports/mysql/vitest-report.json
          if-no-files-found: warn

      - name: Upload recovery rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-report-mysql84
          path: reports/recovery/recovery-report.json
          if-no-files-found: warn

  e2e:
    # Browser-level production-shaped qualification: the real BUILT server + client against a disposable MySQL 8 service
    # container, with in-process fakes for OIDC, the local LLM, an "external" LLM (must never be contacted), S3 and clamd.
    # No paid API, hosted database or deployment is ever contacted.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        env:
          TEST_DATABASE_URL: mysql://root:ci-only-root-password@127.0.0.1:3306
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/e2e
          if-no-files-found: warn

  release-evidence:
    # Consolidates every gate into ONE machine-readable manifest bound to this exact commit. It runs only when validate,
    # mysql-integration and e2e all succeeded (default `needs` semantics). It cannot say RUNTIME_VERIFIED: nothing here
    # observes a deployed runtime. Render/Aiven are never contacted.
    needs: [validate, mysql-integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (for the deployable-output neutrality scan)
        run: pnpm build

      - name: Download validate evidence
        uses: actions/download-artifact@v4
        with:
          name: validate-evidence
          path: reports

      - name: Download MySQL integration report
        uses: actions/download-artifact@v4
        with:
          name: mysql-integration-report
          path: reports/mysql

      - name: Download recovery rehearsal report
        uses: actions/download-artifact@v4
        with:
          name: recovery-report
          path: reports/recovery

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: reports/e2e

      - name: Generate and enforce release evidence manifest
        env:
          RELEASE_UPSTREAM_JOBS_SUCCEEDED: validate,mysql-integration,e2e
        run: pnpm release:evidence --require-pass --require-ci

      - name: Upload release evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: reports/release/release-evidence.json
          if-no-files-found: warn

  release-artifact:
    # The deployable build of the EXACT commit a host would deploy: the PR head (not the merge ref the other jobs test)
    # or the pushed commit. Built with the frozen lockfile, served once to prove the running server verifies its own
    # files, then retained with its manifest. A host that rebuilds from source is tied to this artifact by comparing
    # its /releasez artifact.digest with the digest recorded here (docs/RELEASE_ARTIFACT.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact deployable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser bundle embeds build-time VITE_* values. Repository variables (non-secret; they ship to every browser)
      # mirror the preview host's values so the client digest can match the host's build. Unset variables build without
      # them, and only the server digest is then comparable (docs/RELEASE_ARTIFACT.md).
      - name: Build
        env:
          VITE_APP_ID: ${{ vars.SAKTHIAI_PREVIEW_VITE_APP_ID }}
          VITE_OIDC_AUTHORIZATION_URL: ${{ vars.SAKTHIAI_PREVIEW_VITE_OIDC_AUTHORIZATION_URL }}
          VITE_OIDC_CLIENT_ID: ${{ vars.SAKTHIAI_PREVIEW_VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_SCOPES: ${{ vars.SAKTHIAI_PREVIEW_VITE_OIDC_SCOPES }}
        run: pnpm build

      - name: Verify manifest and served identity
        run: |
          node scripts/release-manifest.mjs --verify
          node scripts/smoke-built-server.mjs
          test "$(node -p 'require("./dist/release-manifest.json").sourceCommit')" = "$(git rev-parse HEAD)"

      - name: Record artifact identity
        id: identity
        run: |
          node -p 'const m=require("./dist/release-manifest.json");`artifact=${m.artifactDigest}\ncommit=${m.sourceCommit}`' >> "$GITHUB_OUTPUT"
          node -e 'const m=require("./dist/release-manifest.json");console.log(`| field | value |\n|---|---|\n| artifact digest | ${m.artifactDigest} |\n| server digest | ${m.components.server.digest} |\n| client digest | ${m.components.client.digest} |\n| VITE variables | ${m.buildEnvironment.viteVariables.join(", ") || "none"} (fingerprint ${m.buildEnvironment.fingerprint}) |\n| files | ${m.fileCount} |\n| source commit | ${m.sourceCommit} |\n| lockfile sha256 | ${m.lockfileSha256} |\n| package.json sha256 | ${m.packageJsonSha256} |\n| node / pnpm | ${m.toolchain.node} / ${m.toolchain.pnpm} |\n| build | ${m.buildCommand} |`)' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ steps.identity.outputs.commit }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
