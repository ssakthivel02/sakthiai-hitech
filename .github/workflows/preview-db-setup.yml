name: SakthiAI Preview DB Setup

# RETIRED ON THE DEFAULT BRANCH — FAIL-CLOSED REFUSAL.
#
# The previous version of this file ran an unguarded `pnpm db:push` against the shared Aiven MySQL service using
# repository-level secrets, with no protected environment, no recovery point and no privilege or journal checks.
#
# The guarded inspect/migrate workflow lives on the integration branch
# `integration/pr7-pr25-runtime-qualification-20260925` (PR #29). It is dispatched explicitly with
# `--ref integration/pr7-pr25-runtime-qualification-20260925`, uses only environment-scoped credentials
# (`sakthiai-preview-db-inspect` / `sakthiai-preview-db-migrate`, branch-restricted, reviewer on migrate) and only
# ever targets `sakthiai_preview` over verified TLS (CA supplied as the environment secret, consumed as
# DATABASE_CA_CERT_B64).
#
# GitHub dispatches a workflow only if its file exists on the default branch, so this file keeps the same path, name
# and inputs. It reads no secret, checks out nothing, uses no environment and always exits non-zero.
# When PR #29 is merged, take the integration-branch version of this file in the merge.

on:
  workflow_dispatch:
    inputs:
      recovery_point:
        description: "Ignored here. Dispatch with --ref integration/pr7-pr25-runtime-qualification-20260925 to use the guarded workflow."
        required: true
        type: string
      mode:
        description: "Ignored here. This default-branch copy always refuses."
        required: true
        type: choice
        options: [inspect, migrate]
        default: inspect

permissions:
  contents: read

concurrency:
  group: sakthiai-preview-db
  cancel-in-progress: false

jobs:
  refuse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse database operations from this branch
        shell: bash
        run: |
          echo "::error::Preview database operations are retired on this branch. Nothing was read, migrated or written."
          echo "Use the guarded workflow: gh workflow run preview-db-setup.yml --ref integration/pr7-pr25-runtime-qualification-20260925 -f mode=inspect -f recovery_point=<UTC>"
          echo "It targets sakthiai_preview only, with protected-environment credentials and DATABASE_CA_CERT_B64 verified TLS."
          exit 1
