name: Protected Main Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-main-gate:
    name: protected-main-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject whitespace and conflict defects
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base" HEAD
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml' '*.css' '*.html'; then
            echo 'Unresolved merge-conflict marker found.' >&2
            exit 1
          fi

      - name: Validate HI-TECH active master and GitHub safety contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const control = JSON.parse(fs.readFileSync('ACTIVE_MASTER_CONTROL.json', 'utf8'));
          const state = JSON.parse(fs.readFileSync('SAKTHIAI_PROJECT_STATE.json', 'utf8'));
          const requiredTaskTrue = [
            'verifyActiveMasterBeforeWork',
            'inventoryCompletedWorkBeforeChanges',
            'changeOnlyEvidenceBackedGaps',
            'neverRebuildCompletedTasks',
            'legacyDevelopmentProhibited',
            'duplicateRepositoryProhibited',
            'duplicateBranchForCompletedWorkProhibited',
            'oneTaskAtATime',
            'requireBuildTestEvidenceBeforeNextTask',
            'clarifyIfActiveMasterUnknown'
          ];
          const requiredSafetyTrue = [
            'verifyCanonicalRepositoryBeforeWrite',
            'verifyActiveBranchBeforeWrite',
            'verifyCurrentMainShaBeforeWrite',
            'inventoryOpenPullRequestsIssuesAndWorkflowsBeforeCreating',
            'directWriteToProtectedMainProhibitedForNormalDevelopment',
            'newTaskBranchMustStartFromExactCurrentMain',
            'forcePushProhibited',
            'destructiveRefMovementProhibited',
            'requiredCiWeakeningProhibited',
            'branchProtectionBypassProhibited',
            'mergeOnlyAfterExactHeadRequiredChecksPass',
            'apiMergeRequiresExpectedHeadShaGuard',
            'postMergeMainShaAndProtectionReverificationRequired',
            'preferSmallestEvidenceBackedChange',
            'stopWhenOnlyManualOrExternalBlockersRemain'
          ];

          if (control.schemaVersion !== '1.1.0') throw new Error('ACTIVE MASTER schema must be 1.1.0');
          if (control.project !== 'SakthiAI') throw new Error('Wrong active-master project');
          if (control.status !== 'HI-TECH — ACTIVE MASTER') throw new Error('Repository is not declared HI-TECH — ACTIVE MASTER');
          if (control.canonicalRepository !== 'ssakthivel02/sakthiai-hitech') throw new Error('Wrong canonical repository');
          if (control.activeBranch !== 'main') throw new Error('Active integration branch must remain main');
          if (control.oldLegacyPolicy !== 'READ_ONLY_REFERENCE') throw new Error('OLD/LEGACY policy must remain read-only reference');
          for (const key of requiredTaskTrue) {
            if (control.taskPolicy?.[key] !== true) throw new Error(`Active-master task rule must remain true: ${key}`);
          }
          for (const key of requiredSafetyTrue) {
            if (control.githubSafetyPolicy?.[key] !== true) throw new Error(`GitHub safety rule must remain true: ${key}`);
          }
          if (control.taskPolicy?.legacyReconciliation !== 'ONE_TIME_INTO_ACTIVE_MASTER_ONLY') {
            throw new Error('Legacy reconciliation policy changed');
          }

          if (state.source_of_truth_status !== control.status) throw new Error('Project state source-of-truth status drifted from ACTIVE MASTER contract');
          if (state.authoritative_source !== control.canonicalRepository) throw new Error('Project state authoritative source must be canonical HI-TECH repository');
          if (state.active_branch !== control.activeBranch) throw new Error('Project state active branch must match ACTIVE MASTER branch');
          if (state.source_of_truth_policy !== 'ACTIVE_MASTER_CONTROL.json') throw new Error('Project state must cite ACTIVE_MASTER_CONTROL.json as source policy');
          if (state.historical_provenance?.status !== 'READ_ONLY_REFERENCE') throw new Error('Historical recovery provenance must remain read-only reference');
          if (typeof state.historical_provenance?.recovery_source !== 'string' || state.historical_provenance.recovery_source.length < 1) {
            throw new Error('Historical recovery provenance must be preserved explicitly');
          }
          if (state.authoritative_source.startsWith('/') || state.canary_source?.startsWith('/')) {
            throw new Error('Local filesystem path cannot be an active authoritative/canary source');
          }

          if (process.env.GITHUB_REPOSITORY !== control.canonicalRepository) {
            throw new Error(`Workflow running in non-canonical repository: ${process.env.GITHUB_REPOSITORY}`);
          }
          if (process.env.GITHUB_BASE_REF && process.env.GITHUB_BASE_REF !== control.activeBranch) {
            throw new Error(`Pull request must target active branch ${control.activeBranch}`);
          }
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const head = process.env.GITHUB_HEAD_REF || '';
            if (!head || head === control.activeBranch) throw new Error('Pull request head must be a dedicated task branch, not main');
          }
          console.log('ACTIVE_MASTER_CONTRACT_PASS project=SakthiAI repo=ssakthivel02/sakthiai-hitech branch=main');
          console.log('GITHUB_SAFETY_CONTRACT_PASS exact-head-ci=required expected-head-merge=required force-push=prohibited');
          NODE

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          test -d client
          test -d server
          test -d scripts
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.name !== 'sakthiai-hitech') throw new Error('Unexpected package name');
          for (const script of ['build','check','test','intelligence:check']) {
            if (!p.scripts?.[script]) throw new Error(`Missing package script: ${script}`);
          }
          console.log('SAKTHIAI_HITECH_REPOSITORY_CONTRACT_PASS');
          NODE
          node --check scripts/build-intelligence-dashboard-data.mjs
          node --check scripts/validate-intelligence-research.mjs

      - name: Governance summary
        if: always()
        run: |
          echo '### SakthiAI Protected Main Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- HI-TECH — ACTIVE MASTER identity and canonical repository check' >> "$GITHUB_STEP_SUMMARY"
          echo '- SAKTHIAI_PROJECT_STATE source truth must match ACTIVE MASTER contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- historical recovery provenance remains read-only reference only' >> "$GITHUB_STEP_SUMMARY"
          echo '- completed-work duplication and evidence-first task rules enforced' >> "$GITHUB_STEP_SUMMARY"
          echo '- strict GitHub safety contract: verify before write, dedicated exact-main branch, no force/destructive ref movement' >> "$GITHUB_STEP_SUMMARY"
          echo '- exact-head required checks and expected-head guarded API merge are mandatory policy' >> "$GITHUB_STEP_SUMMARY"
          echo '- whitespace and merge-conflict defects rejected' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonical sakthiai-hitech repository contract checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- deep build/type/test validation remains in SakthiAI Quality Gate' >> "$GITHUB_STEP_SUMMARY"
