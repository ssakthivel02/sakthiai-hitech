name: SakthiAI Accessibility Semantics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate workspace accessibility semantics
        run: node scripts/validate-accessibility-semantics.mjs
