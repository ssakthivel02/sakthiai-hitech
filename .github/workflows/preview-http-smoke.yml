name: SakthiAI Preview HTTP Smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "HTTPS base URL of the deployed SakthiAI preview"
        required: true
        type: string
      expected_commit:
        description: "Exact Git commit SHA expected to be running on the preview"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate preview inputs
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "preview_url must use HTTPS"; exit 1 ;;
          esac
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_commit must be a full 40-character Git SHA"
            exit 1
          fi

      - name: Verify exact deployed release identity
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/releasez" | tee /tmp/release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('/tmp/release.json', 'utf8'));
          const expected = process.env.EXPECTED_COMMIT.toLowerCase();
          if (release.service !== 'sakthiai') throw new Error('Wrong service identity from /releasez.');
          if (release.repository !== 'ssakthivel02/sakthiai-hitech') throw new Error(`Unexpected repository identity: ${String(release.repository)}`);
          if (release.exactCommitKnown !== true) throw new Error('Deployed SakthiAI commit identity is not available.');
          if (String(release.commit).toLowerCase() !== expected) {
            throw new Error(`Deployed commit ${String(release.commit)} does not match expected commit ${expected}.`);
          }
          console.log(`SakthiAI exact deployed commit PASS: ${expected}`);
          NODE

      - name: Verify live, ready and root surfaces
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/healthz" | tee /tmp/health.json
          curl --fail --silent --show-error --max-time 20 "$base/readyz" | tee /tmp/ready.json
          curl --fail --silent --show-error --max-time 20 "$base/" -o /tmp/root.html
          test -s /tmp/root.html

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const ready = JSON.parse(fs.readFileSync('/tmp/ready.json', 'utf8'));
          if (health.status !== 'alive' || health.service !== 'sakthiai') {
            throw new Error('SakthiAI /healthz payload is invalid.');
          }
          if (ready.status !== 'ready' || ready.service !== 'sakthiai') {
            throw new Error('SakthiAI /readyz did not report ready.');
          }
          const deps = ready.dependencies || {};
          for (const key of ['database', 'authentication', 'llm', 'storage']) {
            if (deps[key] !== 'configured') {
              throw new Error(`SakthiAI dependency ${key} is not configured: ${String(deps[key])}`);
            }
          }
          console.log('SakthiAI dependency readiness payload PASS');
          NODE

          if grep -Eqi "forge\.manus\.im|vite-plugin-manus-runtime|manuspre\.computer|manus\.computer|WebDevAuthPublicService|/app-auth|/__manus__/" /tmp/root.html; then
            echo "Legacy runtime marker found in deployed root HTML"
            exit 1
          fi

      - name: Verify response security and operational cache headers
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          curl --fail --silent --show-error --head --max-time 20 "$base/" -o /tmp/root-headers.txt
          cat /tmp/root-headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/root-headers.txt
          grep -Eqi '^x-frame-options:[[:space:]]*SAMEORIGIN' /tmp/root-headers.txt
          grep -Eqi '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' /tmp/root-headers.txt

          for path in healthz readyz releasez; do
            headers="/tmp/${path}-headers.txt"
            curl --fail --silent --show-error --head --max-time 20 "$base/$path" -o "$headers"
            cat "$headers"
            grep -Eqi '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' "$headers"
            grep -Eqi '^cache-control:[[:space:]]*no-store, max-age=0' "$headers"
            grep -Eqi '^pragma:[[:space:]]*no-cache' "$headers"
          done
