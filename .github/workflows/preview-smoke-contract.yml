name: SakthiAI Preview Smoke Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-smoke-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate operational endpoint and deployment contract
        run: node scripts/validate-preview-smoke-contract.mjs
