name: SakthiAI Secret Hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked repository content
        run: node scripts/validate-secret-hygiene.mjs
      - name: Prove unsafe fixture is rejected
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/validate-secret-hygiene.mjs --fixture release/fixtures/secret-hygiene-fail.txt; then
            echo "Deliberately unsafe secret fixture unexpectedly passed."
            exit 1
          fi
          echo "Unsafe secret fixture correctly rejected."
